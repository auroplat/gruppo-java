<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitFactory | Gestione eventi</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header class="page-shell topbar">
        <a class="brand" href="/" aria-label="BitFactory home">
            <span class="brand-mark">B</span>
            <span>BitFactory</span>
        </a>

        <nav class="topbar-actions" aria-label="Azioni utente">
            <a class="logout-button" href="/logout">Esci</a>
        </nav>
    </header>

    <main class="page-shell event-management-layout single-panel-layout">
        <section class="booking-intro" aria-labelledby="page-title">
            <span class="eyebrow">Gestione eventi</span>
            <h1 id="page-title">Crea un nuovo evento.</h1>
        </section>

        <section class="booking-card" aria-labelledby="form-title">
            <h2 id="form-title">Nuovo evento</h2>
            <p class="form-note">
                Il nome evento viene usato anche dalle prenotazioni: sceglilo chiaro e non duplicato.
            </p>

            <form id="event-form" class="form-grid" action="/creazione-eventi" method="post" novalidate>
                <div class="field full">
                    <label for="nomeEvento">Nome evento</label>
                    <input
                        id="nomeEvento"
                        name="nomeEvento"
                        type="text"
                        maxlength="80"
                        placeholder="Es. Track Day Pavia"
                        autocomplete="off"
                        required>
                </div>

                <div class="field">
                    <label for="dataEvento">Data evento</label>
                    <input
                        id="dataEvento"
                        name="dataEvento"
                        type="date"
                        required>
                </div>

                <div class="field">
                    <label for="postiDisponibili">Posti disponibili</label>
                    <input
                        id="postiDisponibili"
                        name="postiDisponibili"
                        type="number"
                        min="1"
                        step="1"
                        inputmode="numeric"
                        placeholder="Es. 12"
                        required>
                </div>

                <div class="field full">
                    <button class="primary-button compact-button" type="submit">
                        Crea evento
                    </button>

                    <p class="form-note">
                        Dopo il salvataggio l'evento comparirà anche nella pagina delle prenotazioni.
                    </p>
                </div>
            </form>

            <div id="form-message" class="operation-message" role="status" aria-live="polite"></div>
        </section>
    </main>

    <script>
        const CREA_EVENTO_ENDPOINT = "/creazione-eventi";

        const form = document.getElementById("event-form");
        const formMessage = document.getElementById("form-message");

        function showMessage(message, success) {
            formMessage.textContent = message;
            formMessage.className = success
                ? "operation-message visible success"
                : "operation-message visible error";
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            formMessage.className = "operation-message";
            formMessage.textContent = "";

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const formData = new URLSearchParams(new FormData(form));

            try {
                const response = await fetch(CREA_EVENTO_ENDPOINT, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                        "Accept": "application/json"
                    },
                    body: formData
                });

                const result = await response.json();

                if (!response.ok || !result.successo) {
                    showMessage(result.messaggio ?? "Evento non creato.", false);
                    return;
                }

                showMessage(result.messaggio ?? "Evento creato correttamente.", true);
                form.reset();

            } catch (error) {
                console.error(error);
                showMessage(
                    "Operazione non completata. Controlla login, ruolo EVENTI ed endpoint /creazione-eventi.",
                    false
                );
            }
        });
    </script>
</body>
</html>
