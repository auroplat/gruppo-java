<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestione delle sessioni racing BitFactory">
    <title>BitFactory | Gestione sessioni</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="page-shell topbar">
        <a class="brand" href="/" aria-label="BitFactory home">
            <span class="brand-mark">B</span>
            <span>BitFactory</span>
        </a>
        <div class="topbar-actions">
            <a class="topbar-link" href="/">← Home</a>
        </div>
    </header>

    <main class="page-shell session-layout">
        <section class="session-intro" aria-labelledby="page-title">
            <span class="eyebrow">Gestione sessioni</span>
            <h1 id="page-title">Registra ogni giro.</h1>

        </section>

        <section class="session-panel" aria-labelledby="form-title">
            <div class="panel-heading">
                <div>
                    <span class="panel-kicker"></span>
                    <h2 id="form-title">Dati della sessione</h2>
                </div>
            </div>

            <form id="session-form" action="/sessioni" method="post" novalidate>
                <fieldset class="form-section">
                    <legend>
                        <span class="legend-number">01</span>
                        Seleziona la macchina
                    </legend>

                    <div class="cars-select-wrap">
                        <select id="macchine"
                                name="macchina"
                                required>
                            <option value="" selected disabled>
                                Caricamento dal database…
                            </option>
                        </select>
                    </div>

                    <p class="field-error" id="cars-error">
                        Seleziona una macchina.
                    </p>
                </fieldset>

                <fieldset class="form-section">
                    <legend>
                        <span class="legend-number">02</span>
                        Tipo di sessione
                    </legend>

                    <div class="session-switch" role="radiogroup" aria-label="Tipo di sessione">
                        <label>
                            <input type="radio" name="tipoSessione" value="TEST" checked>
                            <span>
                                <strong>Test</strong>
                                <small>Prove, verifiche e sviluppo</small>
                            </span>
                        </label>
                        <label>
                            <input type="radio" name="tipoSessione" value="GARA">
                            <span>
                                <strong>Gara</strong>
                                <small>Competizione e risultato finale</small>
                            </span>
                        </label>
                    </div>
                </fieldset>

                <fieldset class="form-section">
                    <legend>
                        <span class="legend-number">03</span>
                        Informazioni registrate
                    </legend>

                    <div class="form-grid">
                        <div class="field full">
                            <label for="luogo">Circuito o luogo</label>
                            <input id="luogo" name="luogo" type="text" placeholder="Es. Autodromo di Monza" required>
                        </div>

                        <div class="field">
                            <label for="kmPercorsi">Chilometri percorsi</label>
                            <div class="input-unit">
                                <input id="kmPercorsi" name="kmPercorsi" type="number" min="0" step="0.1" placeholder="0,0" required>
                                <span>km</span>
                            </div>
                        </div>

                        <div class="field">
                            <label for="tempoPassato">Tempo trascorso</label>
                            <div class="input-unit">
                                <input id="tempoPassato" name="tempoPassato" type="number" min="0" step="1" placeholder="0" required>
                                <span>min</span>
                            </div>
                        </div>

                        <div class="field full conditional-field" id="test-fields">
                            <label for="descrizione">Descrizione del test</label>
                            <textarea id="descrizione" name="descrizione" rows="4" placeholder="Obiettivi, regolazioni provate e osservazioni tecniche..." required></textarea>
                        </div>

                        <div class="field full conditional-field hidden" id="race-fields">
                            <label for="posizione">Posizione finale</label>
                            <div class="input-unit compact">
                                <input id="posizione" name="posizione" type="number" min="1" step="1" placeholder="1">
                                <span>° posto</span>
                            </div>
                        </div>
                    </div>
                </fieldset>

                <div class="form-footer">
                    <button class="primary-button" type="submit">
                        <span>Registra sessione</span>
                        <span aria-hidden="true">→</span>
                    </button>
                </div>

                <div class="confirmation" id="confirmation" role="status" aria-live="polite">
                    <span class="confirmation-icon">✓</span>
                    <div>
                        <strong>Sessione pronta per la registrazione</strong>
                        <p id="confirmation-text"></p>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <script>
        const MACCHINE_ENDPOINT = "/api/macchine";

        const form = document.getElementById("session-form");
        const carsSelect = document.getElementById("macchine");
        const typeInputs = [...document.querySelectorAll('input[name="tipoSessione"]')];
        const testFields = document.getElementById("test-fields");
        const raceFields = document.getElementById("race-fields");
        const descriptionInput = document.getElementById("descrizione");
        const positionInput = document.getElementById("posizione");
        const carsError = document.getElementById("cars-error");
        const confirmation = document.getElementById("confirmation");
        const confirmationText = document.getElementById("confirmation-text");


        let cars = [];

        function selectedCarId() {
            return carsSelect.value || null;
        }

        function currentType() {
            return typeInputs.find(input => input.checked)?.value || "TEST";
        }

        function normalizeCar(rawCar) {
            const rawId = (typeof rawCar === "string" || typeof rawCar === "number")
                ? rawCar
                : rawCar.id ?? rawCar.numero ?? rawCar.numeroMacchina ?? rawCar.numeroGara;

            const id = String(rawId ?? "").trim();

            if (!id) {
                throw new Error("Una macchina ricevuta dal server non possiede il numero identificativo");
            }

            return { id };
        }

        function renderCars() {
            carsSelect.replaceChildren();

            const placeholder = document.createElement("option");
            placeholder.value = "";
            placeholder.disabled = true;
            placeholder.selected = true;

            if (cars.length === 0) {
                placeholder.textContent = "Nessuna macchina disponibile";
                carsSelect.appendChild(placeholder);
                carsSelect.disabled = true;
                updateCars();
                return;
            }

            placeholder.textContent = "Seleziona una macchina";
            carsSelect.appendChild(placeholder);

            carsSelect.disabled = false;

            for (const car of cars) {
                const option = document.createElement("option");
                option.value = car.id;
                option.textContent = `Macchina n. ${car.id}`;
                carsSelect.appendChild(option);
            }

            updateCars();
        }

        async function loadCars() {
            carsSelect.disabled = true;

            try {
                const response = await fetch(MACCHINE_ENDPOINT, {
                    method: "GET",
                    headers: { "Accept": "application/json" },
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error(`Il server ha risposto con stato ${response.status}`);
                }

                const payload = await response.json();
                const rawCars = Array.isArray(payload) ? payload : payload.macchine;

                if (!Array.isArray(rawCars)) {
                    throw new Error("Formato della risposta non valido");
                }

                cars = rawCars.map(normalizeCar);
                renderCars();
            } catch (error) {
                console.error(error);
                carsSelect.replaceChildren();
                const option = document.createElement("option");
                option.disabled = true;
                option.textContent = "Impossibile caricare le macchine";
                carsSelect.appendChild(option);
                carsSelect.disabled = true;
                updateCars();
            }
        }

        function updateCars() {
            const selectedId = selectedCarId();

            carsError.classList.remove("visible");

            if (!selectedId) {
                return;
            }

        }       

        function updateType() {
            const type = currentType();
            const isTest = type === "TEST";

            testFields.classList.toggle("hidden", !isTest);
            raceFields.classList.toggle("hidden", isTest);
            descriptionInput.required = isTest;
            positionInput.required = !isTest;



            confirmation.classList.remove("visible");
        }

        carsSelect.addEventListener("change", updateCars);
        typeInputs.forEach(input => input.addEventListener("change", updateType));
        form.addEventListener("input", () => confirmation.classList.remove("visible"));

        form.addEventListener("submit", event => {
            const selectedId = selectedCarId();

            if (!selectedId) {
                event.preventDefault();
                carsError.classList.add("visible");
                carsSelect.focus();
                return;
            }

            if (!form.checkValidity()) {
                event.preventDefault();
                form.reportValidity();
            }
        });

        updateType();
        loadCars();
    </script>
</body>
</html>
